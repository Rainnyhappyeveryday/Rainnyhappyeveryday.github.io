<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>条条大路通罗马 · 卡片</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #263440;
    --muted: #72808c;
    --faint: #9ba8b2;
    --line: #dbe7f0;
    --blue: #2f678e;
    --soft: #edf5fb;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1120px; margin: 0 auto; padding: 40px 28px 64px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .rule { width: 30px; height: 3px; border-radius: 2px; background: var(--blue); margin-bottom: 14px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3; letter-spacing: 0; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
  .head-meta { text-align: right; color: var(--muted); font-size: 10.5px; line-height: 1.8; }
  .head-meta b { color: var(--ink); font-weight: 500; }
  .divider { margin: 24px 0 20px; border-top: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; align-items: start; }
  .lead {
    padding: 24px 24px 22px;
    border: 1px solid #cfe0ec;
    border-radius: 16px;
    background: var(--soft);
  }
  .kicker { color: var(--blue); font-size: 10px; letter-spacing: .02em; }
  .date-big { margin-top: 8px; font-family: var(--mono); font-size: 34px; line-height: 1; letter-spacing: -.04em; }
  .date-big small { margin-left: 7px; color: var(--muted); font-family: var(--sans); font-size: 10px; letter-spacing: 0; }
  .lead .inst { margin-top: 18px; font-size: 14px; font-weight: 600; }
  .lead .dir { margin-top: 3px; font-size: 20px; font-weight: 500; line-height: 1.35; }
  .lead .sub { margin-top: 10px; color: var(--muted); font-size: 11px; }
  .lead .sub span + span::before { content: " · "; color: var(--faint); }
  .lead .mark { margin-top: 16px; color: var(--blue); font-family: var(--mono); font-size: 10px; font-weight: 600; }
  .stack { display: grid; gap: 10px; }
  .card {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #ffffff;
  }
  .card-top { display: flex; justify-content: space-between; gap: 10px; }
  .card .date { color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .card .mark { color: var(--muted); font-family: var(--mono); font-size: 9px; font-weight: 600; }
  .card .inst { margin-top: 3px; font-size: 12px; font-weight: 600; line-height: 1.45; }
  .card .dir { margin-top: 1px; font-size: 12.5px; color: #344656; }
  .card .sub { margin-top: 4px; color: var(--muted); font-size: 10px; }
  .card .sub span + span::before { content: " · "; color: var(--faint); }
  .foot { margin-top: 18px; color: var(--faint); font-size: 10px; }
  @media (max-width: 760px) {
    .page { padding: 26px 18px 40px; }
    header { display: block; }
    .head-meta { display: flex; gap: 14px; margin-top: 12px; text-align: left; }
    .grid { grid-template-columns: 1fr; }
    .lead { border-radius: 14px; padding: 20px; }
    .lead .dir { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <div class="rule"></div>
      <h1>条条大路通罗马</h1>
      <p>武汉 · 个人备忘</p>
    </div>
    <div class="head-meta">第 01 期 · 10.13—11.12<br><b>11</b> 条可看　<b>18</b> 条记录</div>
  </header>

  <div class="divider"></div>

  <div class="grid">
    <article class="lead">
      <div class="kicker">最近一条</div>
      <div class="date-big">11.10<small>周二</small></div>
      <div class="inst">武汉理工大学</div>
      <div class="dir">综合办秘书</div>
      <div class="sub"><span>高校</span><span>合同</span><span>1 人</span><span>11.18 截止</span></div>
      <div class="mark">A · 先看</div>
    </article>

    <div class="stack">
      <article class="card">
        <div class="card-top"><span class="date">11.05 周四</span><span class="mark">A</span></div>
        <div class="inst">华中农业大学</div>
        <div class="dir">实验室秘书</div>
        <div class="sub"><span>高校</span><span>派遣</span><span>11.20 截止</span></div>
      </article>
      <article class="card">
        <div class="card-top"><span class="date">11.09 周一</span><span class="mark">B</span></div>
        <div class="inst">武汉学院</div>
        <div class="dir">综合文秘</div>
        <div class="sub"><span>高校</span><span>未注明</span><span>11.16 截止</span></div>
      </article>
      <article class="card">
        <div class="card-top"><span class="date">11.04 周三</span><span class="mark">B</span></div>
        <div class="inst">湖北长江产业现代化工有限公司</div>
        <div class="dir">国际业务销售</div>
        <div class="sub"><span>企业</span><span>2 人</span><span>11.15 截止</span></div>
      </article>
      <article class="card">
        <div class="card-top"><span class="date">10.28 周三</span><span class="mark">B</span></div>
        <div class="inst">武汉设计工程学院</div>
        <div class="dir">思想政治辅导员</div>
        <div class="sub"><span>高校</span><span>合同</span><span>滚动</span></div>
      </article>
    </div>
  </div>

  <div class="foot">共 18 条记录，页面只展示首屏。</div>
</div>
</body>
</html>
