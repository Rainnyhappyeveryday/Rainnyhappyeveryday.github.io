<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>条条大路通罗马 · 页边</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #22313d;
    --muted: #74828e;
    --faint: #9aa6b1;
    --line: #e2e9ef;
    --blue: #3e6f92;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 860px; margin: 0 auto; padding: 56px 28px 72px; }
  .rule { width: 36px; height: 2px; background: var(--blue); margin-bottom: 18px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0; line-height: 1.3; }
  header p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
  .meta {
    display: flex; justify-content: space-between; gap: 20px;
    margin-top: 30px; padding-bottom: 9px; border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 10.5px;
  }
  .meta b { color: var(--ink); font-weight: 500; }
  .list-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 18px 0 8px; color: var(--faint); font-size: 10px;
  }
  .list-head strong { color: var(--ink); font-size: 12px; font-weight: 500; }
  .row {
    display: grid; grid-template-columns: 70px minmax(0, 1fr) 22px;
    gap: 20px; align-items: start; padding: 17px 0;
    border-bottom: 1px solid var(--line);
  }
  .date { font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: nowrap; }
  .date small { display: block; margin-top: 1px; color: var(--faint); font-family: var(--sans); font-size: 9px; }
  .inst { font-size: 14px; font-weight: 600; line-height: 1.45; }
  .dir { margin-top: 2px; color: #344656; font-size: 13px; }
  .sub { margin-top: 5px; color: var(--muted); font-size: 10.5px; }
  .sub span + span::before { content: " · "; color: var(--faint); }
  .mark {
    color: var(--blue); font-family: var(--mono); font-size: 10px; font-weight: 600;
    text-align: right; padding-top: 2px;
  }
  .mark.b { color: var(--muted); }
  .end { padding-top: 18px; color: var(--faint); font-size: 10px; }
  @media (max-width: 600px) {
    .page { padding: 32px 18px 44px; }
    header h1 { font-size: 22px; }
    .meta { margin-top: 20px; }
    .row { grid-template-columns: 1fr 18px; gap: 8px 12px; padding: 14px 0; }
    .date { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; }
    .date small { display: inline; margin: 0; }
    .sub span { display: inline; }
    .mark { grid-column: 2; grid-row: 2; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="rule"></div>
  <header>
    <h1>条条大路通罗马</h1>
    <p>武汉 · 个人备忘</p>
  </header>

  <div class="meta">
    <span>第 01 期 · 10.13—11.12</span>
    <span><b>11</b> 条可看　<b>18</b> 条记录</span>
  </div>

  <div class="list-head"><strong>近期记录</strong><span>按日期</span></div>

  <div class="row">
    <div class="date">11.10<small>周一</small></div>
    <div>
      <div class="inst">武汉理工大学</div>
      <div class="dir">综合办秘书</div>
      <div class="sub"><span>高校</span><span>合同</span><span>1 人</span><span>11.18 截止</span></div>
    </div>
    <div class="mark">A</div>
  </div>

  <div class="row">
    <div class="date">11.05<small>周四</small></div>
    <div>
      <div class="inst">华中农业大学</div>
      <div class="dir">实验室秘书</div>
      <div class="sub"><span>高校</span><span>派遣</span><span>1 人</span><span>11.20 截止</span></div>
    </div>
    <div class="mark">A</div>
  </div>

  <div class="row">
    <div class="date">11.09<small>周一</small></div>
    <div>
      <div class="inst">武汉学院</div>
      <div class="dir">综合文秘</div>
      <div class="sub"><span>高校</span><span>未注明</span><span>1 人</span><span>11.16 截止</span></div>
    </div>
    <div class="mark b">B</div>
  </div>

  <div class="row">
    <div class="date">11.04<small>周三</small></div>
    <div>
      <div class="inst">湖北长江产业现代化工有限公司</div>
      <div class="dir">国际业务销售</div>
      <div class="sub"><span>企业</span><span>企业</span><span>2 人</span><span>11.15 截止</span></div>
    </div>
    <div class="mark b">B</div>
  </div>

  <div class="row">
    <div class="date">10.28<small>周三</small></div>
    <div>
      <div class="inst">武汉设计工程学院</div>
      <div class="dir">思想政治辅导员</div>
      <div class="sub"><span>高校</span><span>合同</span><span>若干</span><span>滚动</span></div>
    </div>
    <div class="mark b">B</div>
  </div>

  <div class="end">共 18 条记录，页面只展示首屏。</div>
</div>
</body>
</html>
